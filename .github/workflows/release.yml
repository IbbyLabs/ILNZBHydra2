name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        required: true
        type: choice
        description: "Semver bump type"
        options:
          - patch
          - minor
          - major
        default: patch
      dryRun:
        required: true
        type: boolean
        description: "Use local dry run mode (skip git push, GitHub release, Discord publish)"
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend tests
        run: mvn --batch-mode -pl core -am test

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, lint, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Docker image build check
        run: docker build -f Dockerfile -t nzbhydra2:release-check .

  compute_version:
    name: Compute release version
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      releaseVersion: ${{ steps.next_version.outputs.releaseVersion }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version
        id: next_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bump="${{ inputs.bump }}"
          repo="${{ github.repository }}"

          latest_tag="$({
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases?per_page=100" \
              | jq -r '.[].tag_name // empty' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          } || true)"

          if [[ -z "$latest_tag" ]]; then
            major=0
            minor=0
            patch=0
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
          fi

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump type: $bump" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          echo "releaseVersion=$next_version" >> "$GITHUB_OUTPUT"
          echo "Computed release version: $next_version"

  release:
    name: Build, tag, and publish
    needs: [preflight, compute_version]
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies for release script
        run: python -m pip install --upgrade pip click rich

      - name: Prepare release token files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" > githubtoken.txt
          printf '%s' "${DISCORD_TOKEN:-}" > discordtoken.txt

      - name: Execute release flow
        shell: bash
        run: |
          set -euo pipefail
          release_version='${{ needs.compute_version.outputs.releaseVersion }}'
          dry_mode='off'
          if [[ '${{ inputs.dryRun }}' == 'true' ]]; then
            dry_mode='local'
          fi

          echo "Starting release for version ${release_version} (dry mode: ${dry_mode})"
          python misc/build_and_release.py --version "${release_version}" --dry-run "${dry_mode}"
